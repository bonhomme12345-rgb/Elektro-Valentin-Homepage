name: Veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: elektro-valentin
  # Anmeldung bei Google ohne Schlüsseldatei (Workload Identity Federation).
  # Nur dieses Repository darf das Dienstkonto benutzen.
  WORKLOAD_IDENTITY_PROVIDER: projects/485980459991/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: github-deploy@elektro-valentin.iam.gserviceaccount.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Bei Google anmelden
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # Bei einem Pull Request: Vorschau-Link, der 7 Tage gültig ist
      - name: Vorschau veröffentlichen
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! npx firebase hosting:channel:deploy "pr-${{ github.event.number }}" --expires 7d --project "$PROJECT_ID" --non-interactive --json > channel.json 2> error.log; then
            echo "::error title=Vorschau fehlgeschlagen::$(cat channel.json error.log | tr '\n' ' ' | tail -c 1500)"
            exit 1
          fi
          URL=$(node -e "const r=require('./channel.json').result; console.log(Object.values(r)[0].url)")
          echo "::notice title=Vorschau::$URL"
          echo "### Vorschau: $URL" >> "$GITHUB_STEP_SUMMARY"

      # Auf main: Seite sowie Regeln für Datenbank und Fotos live schalten
      - name: Live veröffentlichen
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          if ! npx firebase deploy --only hosting,firestore,storage --project "$PROJECT_ID" --non-interactive 2>&1 | tee deploy.log; then
            echo "::error title=Veröffentlichen fehlgeschlagen::$(tail -c 1500 deploy.log | tr '\n' ' ')"
            exit 1
          fi
